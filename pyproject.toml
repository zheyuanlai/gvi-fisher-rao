[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fr-gvi"
version = "0.1.0"
description = "Reproducible Gaussian variational inference experiments under Fisher--Rao geometry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.5.0",
  "scipy==1.18.0",
  "matplotlib==3.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
]

[project.scripts]
fr-gvi-run = "fr_gvi.experiments.campaign:main"
fr-gvi-plot = "fr_gvi.plotting.figures:main"
fr-gvi-audit = "fr_gvi.experiments.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

